<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Makoto ຈັດເຄື່ອງ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Makoto Pack">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0e1c">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--pri:#1f6feb;--ok:#16a34a;--okbg:#dcfce7;--warn:#d97706;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Lao","Phetsarath OT",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#111827;color:#fff}
.brand{font-weight:700;white-space:nowrap}
.bar select{flex:1;min-width:0;padding:9px;border-radius:8px;border:0;font-size:15px}
.chipbtn{background:#374151;color:#fff;border:0;border-radius:999px;padding:9px 12px;font-size:14px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:12px;max-width:720px;margin:0 auto 40px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:14px;color:var(--ink)}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;gap:6px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ono{font-weight:700;font-size:18px}
.mute{color:var(--mute);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#eef0f3;color:var(--mute)}
.pill.y{background:var(--okbg);color:#166534}.pill.bad{background:var(--badbg);color:#991b1b}.pill.w{background:var(--warnbg);color:#92400e}.pill.p{background:#ede9fe;color:#5b21b6}
.warnbox{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--badbg);color:#991b1b;font-size:14px;font-weight:600}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;background:#e5e7eb;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.full{width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--pri);font-size:14px;padding:10px 0;text-decoration:underline;font-family:inherit}
.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.section h4{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;overflow-wrap:anywhere;font-weight:600}
.cnt{min-width:58px;text-align:center;font-weight:700;border-radius:8px;padding:7px 4px}
.cnt.none{background:#eef0f3}.cnt.part{background:var(--warnbg);color:#92400e}.cnt.done{background:var(--okbg);color:#166534}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);margin-bottom:8px}
.st.y{background:var(--okbg);border-color:#bbf7d0}
.progress{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:8px 0}
.progress div{height:100%;background:var(--ok);transition:width .2s}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.hidden{display:none!important}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 8px}
#scanner{background:#000;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:auto}
.scanTop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;gap:8px}
.camwrap{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:4/3;background:#000;overflow:hidden}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:5%;right:5%;top:20%;bottom:20%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .15s}
.guide::after{content:'';position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ef4444;opacity:.8}
.guide[data-k=ok]{border-color:#22c55e}.guide[data-k=bad]{border-color:#ef4444}.guide[data-k=warn]{border-color:#f59e0b}
.camerr{margin:8px 12px;padding:10px;border-radius:10px;background:var(--warnbg);color:#92400e;font-size:14px}
.msg{margin:8px 12px;padding:12px;border-radius:10px;font-weight:700;text-align:center;background:#1f2937;color:#fff;font-size:17px;overflow-wrap:anywhere}
.msg.ok{background:var(--ok)}.msg.bad{background:var(--bad)}.msg.warn{background:var(--warn)}
.scanPanel{background:#fff;border-radius:16px 16px 0 0;padding:12px;margin-top:auto}
.manual{display:flex;gap:6px;margin:8px 0}
.manual input,input.txt{flex:1;min-width:0;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
input.txt{margin:8px 0 12px}
.camerr{margin:8px 12px;padding:10px;border-radius:10px;background:var(--warnbg);color:#92400e;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#flashOv{position:fixed;inset:0;z-index:25;pointer-events:none;opacity:0;transition:opacity .35s}
#flashOv.on{opacity:.55;transition:none}
.lblimg{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:8px;background:#f3f4f6;margin:6px 0}
.lblstate{font-weight:700;margin:6px 0}
.choice{display:grid;gap:8px;margin:10px 0}
.staffgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.center{text-align:center;padding:40px 10px;color:var(--mute)}
a{color:var(--pri)}
.live{font-size:12px;color:#9ca3af;white-space:nowrap}.live b{color:#22c55e}.live.off b{color:#f59e0b}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">📦 ຈັດເຄື່ອງ</div>
  <select id="tabSel" aria-label="ຮອບໄລຟ໌"></select>
  <span id="live" class="live"><b>●</b></span>
  <button id="staffBtn" class="chipbtn">👤 …</button>
</header>
<main id="app"><div class="center">ກຳລັງໂຫຼດ…</div></main>

<div id="scanner" class="overlay hidden">
  <div class="scanTop"><b id="scanTitle"></b><div class="row" style="gap:6px"><button class="btn sm hidden" id="torchBtn">🔦 ໄຟ</button><button class="btn sm" id="scanClose">ແລ້ວ</button></div></div>
  <div class="camwrap" id="camWrap"><video id="cam" playsinline muted autoplay></video><div class="guide"></div></div>
  <div id="camErr" class="camerr hidden"></div>
  <div id="scanMsg" class="msg">ສ່ອງກ້ອງໃສ່ບາໂຄດ</div>
  <div class="scanPanel">
    <div class="row" style="gap:6px">
      <button class="btn sm" id="undoBtn" style="flex:1">↶ ຍົກເລີກອັນລ່າສຸດ</button>
      <label class="btn sm" style="flex:1">📷 ຈາກຮູບ<input type="file" accept="image/*" capture="environment" id="photoIn" hidden></label>
    </div>
    <form class="manual" id="manualF"><input id="manualIn" placeholder="ພິມບາໂຄດ ຫຼື ລະຫັດ (ເຊັ່ນ L60)" autocomplete="off"><button class="btn sm pri">ເພີ່ມ</button></form>
    <div id="scanItems"></div>
  </div>
</div>

<div id="modal" class="overlay hidden"><div class="sheet" id="modalBody"></div></div>
<div id="toast"></div>
<div id="flashOv"></div>
<label id="hapt" style="position:absolute;left:-9999px;opacity:0"><input type="checkbox" switch></label>
<input type="file" accept="image/*" capture="environment" id="labelIn" hidden>
<div id="filescan" style="display:none"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem('ps_' + k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem('ps_' + k, v); } catch(e) {} },
  del(k){ try { localStorage.removeItem('ps_' + k); } catch(e) {} }
};
const money = n => (Number(n) || 0).toLocaleString('en-US');
const S = { pin: store.get('pin') || '', staff: store.get('staff') || '', staffList: [], tabs: [], tab: '', names: {},
  orders: [], at: '', filter: 'topack', q: '', cur: null, counts: [], hist: [], last: { c: '', t: 0 }, busy: false, ver: '', pending: 0, syncing: false };

(function () {
  try { const q = new URLSearchParams(location.search).get('api'); if (q) store.set('api', q); } catch (e) {}
})();
const API = store.get('api') || 'https://script.google.com/macros/s/AKfycbzIsGrHnZiYnKNlQkOIFmOkchK4TN5wkbETV-MyUYp1nVAx_Frz114wmCSUCl2k4hcX/exec';
async function api(fn, arg) {
  if (!API) throw new Error('ລິ້ງແອັບບໍ່ຄົບ. ຂໍລິ້ງໃໝ່ຈາກເຈົ້າຂອງຮ້ານ.');
  const action = { apiBootstrap: 'bootstrap', apiOrders: 'orders', apiUpdate: 'update', apiLabelSent: 'labelsent', apiLabelImg: 'labelimg', apiLabelAssign: 'labelassign', apiLabelDismiss: 'labeldismiss' }[fn];
  const payload = (fn === 'apiOrders' && typeof arg === 'string') ? { tab: arg } : (arg || {});
  const url = API + '?action=' + action + '&pin=' + encodeURIComponent(S.pin) + '&payload=' + encodeURIComponent(JSON.stringify(payload));
  let r;
  try { r = await fetch(url, { redirect: 'follow' }); } catch (e) { throw new Error('ເຊື່ອມຕໍ່ຊີດບໍ່ໄດ້. ກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('ຊີດຕອບກັບບໍ່ຖືກຕ້ອງ. ກວດການຕັ້ງຄ່າ Apps Script (Anyone).'); }
  if (!j.ok) throw new Error(j.error || 'ຜິດພາດ');
  return j.data;
}
async function apiPost(body) {
  let r;
  try { r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin: S.pin }, body)), redirect: 'follow' }); }
  catch (e) { throw new Error('ເຊື່ອມຕໍ່ຊີດບໍ່ໄດ້. ກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('ຊີດຕອບກັບບໍ່ຖືກຕ້ອງ.'); }
  if (!j.ok) throw new Error(j.error || 'ຜິດພາດ');
  return j.data;
}
const errMsg = e => String((e && e.message) || e || 'ຜິດພາດ').replace(/^Exception:\s*/, '');

/* ---------- feedback ---------- */
let AC;
function beep(freq, dur) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.value = freq; o.connect(g); g.connect(AC.destination); g.gain.value = 0.35;
    o.start(); o.stop(AC.currentTime + dur);
  } catch(e) {}
}
/* Buzz: Android vibrates; iPhone (iOS 18+) gets a haptic tap from a hidden switch. */
const haptic = () => { try { $('#hapt').click(); } catch (e) {} };
const vib = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch(e) {} haptic(); if (Array.isArray(p)) setTimeout(haptic, 160); };
let flashT;
function screenFlash(kind) {
  const el = $('#flashOv'); if (!el || !kind) return;
  el.style.background = kind === 'ok' ? '#22c55e' : kind === 'bad' ? '#ef4444' : '#f59e0b';
  el.classList.add('on'); clearTimeout(flashT); flashT = setTimeout(() => el.classList.remove('on'), 90);
}
let toastT;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2500); }
function flash(kind, msg) { const m = $('#scanMsg'); m.className = 'msg ' + kind; m.textContent = msg; const g = document.querySelector('.guide'); if (g) g.dataset.k = kind || ''; screenFlash(kind); }

/* ---------- dialogs ---------- */
function dialog(html, mount) {
  return new Promise(res => {
    $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden');
    mount(v => { $('#modal').classList.add('hidden'); res(v); });
  });
}
function ask(title, label, val, type) {
  return dialog(`<h3>${esc(title)}</h3><div class="mute">${esc(label || '')}</div>
    <input class="txt" id="dlgIn" type="${type || 'text'}" value="${esc(val || '')}">
    <div class="row"><button class="btn" id="dlgNo">ຍົກເລີກ</button><button class="btn pri" id="dlgOk">ຕົກລົງ</button></div>`, done => {
    const i = $('#dlgIn'); setTimeout(() => i.focus(), 50);
    $('#dlgNo').onclick = () => done(null); $('#dlgOk').onclick = () => done(i.value);
    i.onkeydown = e => { if (e.key === 'Enter') done(i.value); };
  });
}
function confirmBox(msg) {
  return dialog(`<p style="margin-top:0;white-space:pre-line">${esc(msg)}</p><div class="row"><button class="btn" id="dlgNo">ຍົກເລີກ</button><button class="btn pri" id="dlgOk">ແມ່ນ</button></div>`,
    done => { $('#dlgNo').onclick = () => done(false); $('#dlgOk').onclick = () => done(true); });
}
async function pickStaff() {
  const list = S.staffList;
  const n = await dialog(`<h3>ໃຜກຳລັງຈັດເຄື່ອງ?</h3>
    ${list.length ? `<div class="staffgrid">${list.map(x => `<button class="btn" data-n="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="mute" style="margin-top:12px">ຫຼື ພິມຊື່ຂອງທ່ານ</div>` : '<div class="mute">ພິມຊື່ຂອງທ່ານ — ຈະບັນທຶກໄວ້ທຸກຄັ້ງທີ່ຈັດ, ສົ່ງ ຫຼື ໝາຍວ່າຈ່າຍແລ້ວ.</div>'}
    <input class="txt" id="dlgIn" value="${esc(S.staff)}" placeholder="ຊື່ຂອງທ່ານ"><button class="btn pri full" id="dlgOk">ຕໍ່ໄປ</button>`, done => {
    document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => done(b.dataset.n));
    const ok = () => { const v = $('#dlgIn').value.trim(); if (v) done(v); };
    $('#dlgOk').onclick = ok; $('#dlgIn').onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
  S.staff = n; store.set('staff', n); $('#staffBtn').textContent = '👤 ' + n;
}

/* ---------- boot & data ---------- */
async function boot() {
  try {
    const b = await api('apiBootstrap');
    S.tabs = b.tabs; S.staffList = b.staff; S.names = b.names || {};
    if (!S.tabs.length) { $('#app').innerHTML = '<div class="center">ບໍ່ພົບແຖບທີ່ຂຶ້ນຕົ້ນດ້ວຍ “live” ໃນຊີດນີ້.</div>'; return; }
    const saved = store.get('tab');
    S.tab = S.tabs.includes(saved) ? saved : S.tabs[0];
    $('#tabSel').innerHTML = S.tabs.map(t => `<option ${t === S.tab ? 'selected' : ''}>${esc(t)}</option>`).join('');
    if (!S.staff) await pickStaff(); else $('#staffBtn').textContent = '👤 ' + S.staff;
    await loadOrders();
  } catch (e) {
    if (errMsg(e).includes('PIN_REQUIRED')) {
      const p = await ask('ໃສ່ລະຫັດ PIN', S.pin ? 'ລະຫັດ PIN ບໍ່ຖືກຕ້ອງ.' : 'ຂໍລະຫັດ PIN ຈາກເຈົ້າຂອງຮ້ານ.', '', 'password');
      if (p !== null) { S.pin = p.trim(); store.set('pin', S.pin); return boot(); }
    }
    $('#app').innerHTML = `<div class="center">⚠ ${esc(errMsg(e))}<br><br><button class="btn" onclick="boot()">ລອງໃໝ່</button></div>`;
  }
}
function setLive(ok) { const el = $('#live'); if (el) { el.classList.toggle('off', !ok); el.title = ok ? 'ອອນລາຍ' : 'ອອບລາຍ – ກຳລັງລອງໃໝ່'; } }
function applyOrders(r) {
  S.orders = r.orders; S.problems = r.problems || []; S.ver = r.ver || ''; S.at = r.at;
  if (S.cur) {
    const o = S.orders.find(x => x.no === S.cur.no);
    if (o) { const same = o.items.length === S.cur.items.length; S.cur = o; if (!same) S.counts = o.items.map(() => 0); renderOrder(); }
    else { S.cur = null; renderList(); }
  } else if (S.queue) renderQueue();
  else if (!document.activeElement || document.activeElement.id !== 'q') renderList(); else renderCards();
}
async function loadOrders(quiet) {
  if (!quiet && !S.cur) $('#app').innerHTML = '<div class="center">ກຳລັງໂຫຼດອໍເດີ…</div>';
  try {
    const r = await api('apiOrders', { tab: S.tab, ver: quiet ? S.ver : '' });
    setLive(true);
    if (r.unchanged) { S.at = r.at; return; }
    applyOrders(r);
  } catch (e) {
    setLive(false);
    if (!quiet) { toast('⚠ ' + errMsg(e), 5000); if (!S.cur) $('#app').innerHTML = `<div class="center">⚠ ${esc(errMsg(e))}</div>`; }
  }
}
/* Check the sheet for changes every few seconds while the app is open. */
async function poll() {
  if (S.syncing || S.pending || document.hidden || !S.tab) return;
  if (!$('#modal').classList.contains('hidden')) return;
  S.syncing = true;
  try { await loadOrders(true); } finally { S.syncing = false; }
}
setInterval(poll, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { poll(); refreshTabs(); } });
/* New live tabs: the home-screen app can stay open for days, so re-check the tab list. */
let tabsAt = Date.now();
async function refreshTabs() {
  if (Date.now() - tabsAt < 60000 || S.pending || !S.tab) return;
  tabsAt = Date.now();
  try {
    const b = await api('apiBootstrap');
    if (!b.tabs || !b.tabs.length || b.tabs.join('|') === S.tabs.join('|')) return;
    S.tabs = b.tabs; S.staffList = b.staff || S.staffList; S.names = b.names || S.names;
    const newest = S.tabs[0];
    if (store.get('newest') !== newest && !S.cur && !S.queue) {   // a new live day → switch to it
      S.tab = newest; store.set('tab', newest); S.filter = 'topack'; toast('📅 ແຖບໃໝ່: ' + newest, 4000); loadOrders();
    }
    store.set('newest', newest);
    $('#tabSel').innerHTML = S.tabs.map(t => `<option ${t === S.tab ? 'selected' : ''}>${esc(t)}</option>`).join('');
  } catch (e) {}
}
setInterval(refreshTabs, 120000);

/* ---------- list ---------- */
/* ລໍຖ້າຈັດ = paid or pickup-at-store, not packed yet · ລໍຖ້າສົ່ງ = packed, not shipped yet */

let pdfReady = null; const pdfDocs = {};
function pdfjs() {

    s.src = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    s.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; res(window.pdfjsLib); };

async function pdfPageImage(u8, id, page, tracking) {
  const lib = await pdfjs();

  const key = String(tracking || '').replace(/\s/g, '');
  if (key && doc.numPages > 1) {                 // find the page that carries this tracking number
    for (let i = 1; i <= doc.numPages; i++) {
      const tc = await (await doc.getPage(i)).getTextContent();
      if (tc.items.map(x => x.str).join(' ').replace(/\s/g, '').includes(key)) { n = i; break; }
    }
  }
  const pg = await doc.getPage(n), vp = pg.getViewport({ scale: 2 });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);

}

async function fetchLabel(o) {

      const r = await api('apiLabelImg', { id: o.label });
      const bin = atob(r.data); u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);

function setLabelFile(no, file) {

  const rec = { file, url: URL.createObjectURL(file) };
  rec.png = loadImg(file).then(img => new Promise(r => { const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight; c.getContext('2d').drawImage(img, 0, 0); c.toBlob(r, 'image/png'); }));

  return loadImg(file).then(img => {
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);

    try { URL.revokeObjectURL(img.src); } catch (e) {}
    return new Promise(r => c.toBlob(b => r(new File([b], 'label.jpg', { type: 'image/jpeg' })), 'image/jpeg', 0.8));

}

/* Update the screen at once, save to the sheet in the background. */
async function update(action, value, extra) {
  const o = S.cur; if (!o) return;
  const key = { packed: 'packed', shipped: 'shipped', paid: 'paid' }[action];
  const before = { v: o[key], by: o[key + 'By'], at: o[key + 'At'], tracking: o.tracking };
  o[key] = value; o[key + 'By'] = value ? S.staff : ''; o[key + 'At'] = value ? nowText() : '';
  if (action === 'shipped' && value && extra && extra.tracking) o.tracking = extra.tracking;
  if (action === 'packed') { if (value) store.del(scanKey(o)); else S.counts = o.items.map(() => 0); }
  if (S.cur === o) renderOrder();
  toast((value ? '✓ ' : 'ຍົກເລີກ: ') + ACT_LA[action] + ' · ກຳລັງບັນທຶກ…', 1500); vib(60);
  S.pending++;
  try {
    const r = await api('apiUpdate', Object.assign({ tab: S.tab, orderNo: o.no, action, value, staff: S.staff }, extra || {}));
    if (r.order) {
      const i = S.orders.findIndex(x => x.no === r.order.no);
      if (i >= 0) S.orders[i] = r.order;
      if (S.cur && S.cur.no === r.order.no) { S.cur = r.order; renderOrder(); }

    o[key] = before.v; o[key + 'By'] = before.by; o[key + 'At'] = before.at; o.tracking = before.tracking;
    if (S.cur === o) renderOrder();
    toast('⚠ ບັນທຶກບໍ່ໄດ້: ' + errMsg(e), 6000); beep(220, .4); setLive(false);

}

  const n = (e && e.name) || '';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'ກ້ອງຖືກບລັອກ. iPhone: ກົດ "aA" ໃນແຖບທີ່ຢູ່ Safari → ການຕັ້ງຄ່າເວັບໄຊ → ກ້ອງ → ອະນຸຍາດ, ແລ້ວໂຫຼດໜ້າໃໝ່. ຖ້າເປີດລິ້ງໃນ LINE, Messenger ຫຼື Facebook ໃຫ້ເປີດໃນ Safari ຫຼື Chrome ແທນ.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'ບໍ່ພົບກ້ອງຫຼັງໃນເຄື່ອງນີ້.';
  if (n === 'NotReadableError') return 'ກ້ອງກຳລັງຖືກໃຊ້ໂດຍແອັບອື່ນ. ປິດແອັບກ້ອງອື່ນ ແລ້ວລອງໃໝ່.';
  return 'ເປີດກ້ອງບໍ່ໄດ້ (' + errMsg(e) + ').';
}
async function openScanner() {
  S.last = { c: '', t: 0 };
  $('#scanner').classList.remove('hidden'); $('#camErr').classList.add('hidden');
  flash('', 'ກຳລັງເປີດກ້ອງ…'); renderScanItems();
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume && AC.resume(); } catch (e) {}
  zx().catch(e => camErr(errMsg(e)));
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camErr('ບຣາວເຊີນີ້ໃຊ້ກ້ອງບໍ່ໄດ້. ເປີດລິ້ງໃນ Safari (iPhone) ຫຼື Chrome (Android).');
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) { cam.stream = null; flash('', 'ກ້ອງປິດ — ໃຊ້ “ຈາກຮູບ” ຫຼື ພິມລະຫັດ'); return camErr(camMessage(e)); }
  if ($('#scanner').classList.contains('hidden')) { stopCamera(); return; }
  const v = $('#cam'); v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = cam.stream;
  try { await v.play(); } catch (e) {}
  cam.track = cam.stream.getVideoTracks()[0];
  tuneCamera();
  flash('', 'ສ່ອງບາໂຄດໃຫ້ຢູ່ໃນກອບ — ຫ່າງ 15–30 ຊມ');
  cam.n = 0; loop();
}
async function tuneCamera() {
  const t = cam.track; let c = {};
  try { c = (t && t.getCapabilities && t.getCapabilities()) || {}; } catch (e) {}
  if (c.focusMode && c.focusMode.indexOf('continuous') >= 0) { try { await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {} }
  if (c.zoom && c.zoom.max >= 1.5) { try { await t.applyConstraints({ advanced: [{ zoom: Math.min(1.8, c.zoom.max) }] }); } catch (e) {} }
  cam.torch = false; $('#torchBtn').classList.toggle('hidden', !c.torch);
}
function loop() {
  if (!cam.stream) return;
  cam.timer = setTimeout(async () => {
    const v = $('#cam');
    if (cam.stream && !cam.busy && v.readyState >= 2 && v.videoWidth) {
      cam.busy = true;
      try {
        const vw = v.videoWidth, vh = v.videoHeight, A = 4 / 3;
        let visW = vw, visH = vh;                       // part of the frame visible in the 4:3 box
        if (vw / vh > A) visW = vh * A; else visH = vw / A;
        const full = (cam.n++ % 4 === 3);               // every 4th frame look at the whole view
        const cw = full ? visW : visW * 0.9, ch = full ? visH : visH * 0.6;
        const sx = (vw - cw) / 2, sy = (vh - ch) / 2, sc = Math.min(1, 1280 / cw);
        grab.width = Math.round(cw * sc); grab.height = Math.round(ch * sc);
        gctx.drawImage(v, sx, sy, cw, ch, 0, 0, grab.width, grab.height);
        const text = await decodeImageData(gctx.getImageData(0, 0, grab.width, grab.height), full);
        if (text && cam.stream) {
          const now = Date.now();
          if (!(text === S.last.c && now - S.last.t < 1800)) { S.last = { c: text, t: now }; handleCode(text); }
        }
      } catch (e) {}
      cam.busy = false;
    }
    loop();
  }, 80);
}
function stopCamera() {
  clearTimeout(cam.timer); cam.timer = null;
  if (cam.stream) { cam.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); }
  cam.stream = null; cam.track = null;
  try { $('#cam').srcObject = null; } catch (e) {}
}
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => res(i);
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('ເປີດຮູບບໍ່ໄດ້')); };
    i.src = u;
  });
}
function photoVariant(img, max, crop, boost) {
  const W = img.naturalWidth, H = img.naturalHeight, c = crop || [0, 0, 1, 1];
  const sw = W * c[2], sh = H * c[3], s = Math.min(1, max / Math.max(sw, sh));
  const cv = document.createElement('canvas');
  cv.width = Math.round(sw * s); cv.height = Math.round(sh * s);
  const g = cv.getContext('2d', { willReadFrequently: true });
  if (boost) { try { g.filter = 'grayscale(1) contrast(1.6)'; } catch (e) {} }
  g.drawImage(img, W * c[0], H * c[1], sw, sh, 0, 0, cv.width, cv.height);
  return g.getImageData(0, 0, cv.width, cv.height);
}
async function readPhoto(file) {
  const img = await loadImg(file);
  try {
    const plans = [[2000, null, false], [1280, null, false], [1600, [0, 0.25, 1, 0.5], false], [1280, null, true], [2600, null, false]];
    for (const [max, crop, boost] of plans) {
      const t = await decodeImageData(photoVariant(img, max, crop, boost), true);
      if (t) return t;
    }
  } finally { try { URL.revokeObjectURL(img.src); } catch (_) {} }
  throw new Error('ບໍ່ພົບບາໂຄດ');
}
async function closeScanner() {
  stopCamera();
  $('#scanner').classList.add('hidden'); renderOrder();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-f],[data-open],[data-act],[data-undo],[data-tick],[data-minus],[data-assign],[data-dismiss]'); if (!t) return;
  const d = t.dataset;
  if (d.f) { S.filter = d.f; renderList(); return; }
  if (d.assign) { assignLabel(d.assign); return; }
  if (d.dismiss) { if (await confirmBox('ລຶບຮູບນີ້ອອກຈາກລາຍການ? (ຮູບຍັງຢູ່ໃນ Drive)')) { S.problems = S.problems.filter(p => (p.key || p.id) !== d.dismiss); renderList(); api('apiLabelDismiss', { id: d.dismiss }).catch(e => toast('⚠ ' + errMsg(e))); } return; }
  if (d.open) { openOrder(d.open); return; }
  if (d.tick !== undefined) { const i = +d.tick, it = S.cur.items[i]; S.counts[i] = S.counts[i] >= it.qty ? 0 : it.qty; saveScan(); renderOrder(); return; }
  if (d.minus !== undefined) { const i = +d.minus; if (S.counts[i] > 0) S.counts[i]--; saveScan(); renderOrder(); return; }
  if (d.undo) { if (await confirmBox('ຍົກເລີກ “' + ACT_LA[d.undo] + '” ຂອງອໍເດີ #' + S.cur.no + '?')) update(d.undo, false); return; }
  switch (d.act) {
    case 'back': S.cur = null; S.queue = null; renderList(); loadOrders(true); break;
    case 'refresh': loadOrders(); break;
    case 'scan': openScanner(); break;
    case 'pack': doPack(false); break;
    case 'override': doPack(true); break;
    case 'reset': if (await confirmBox('ລ້າງຈຳນວນທີ່ສະແກນຂອງອໍເດີນີ້?')) { S.counts = S.cur.items.map(() => 0); saveScan(); renderOrder(); } break;
    case 'ship': { const tr = await ask('ສົ່ງແລ້ວ / ຮັບແລ້ວ · ອໍເດີ #' + S.cur.no, 'ເລກພັດສະດຸ (ບໍ່ໃສ່ກໍໄດ້)', S.cur.tracking || ''); if (tr !== null) update('shipped', true, { tracking: tr.trim() }); break; }
    case 'labelshot': $('#labelIn').click(); break;
    case 'labelshare': waSend(S.cur); break;
    case 'labelok': labelSent(S.cur, true); break;
    case 'labelfail': { const r = await failReason(); if (r) labelSent(S.cur, false, r); break; }
    case 'labelclear': if (await confirmBox('ລ້າງສະຖານະການສົ່ງໃບຂອງອໍເດີ #' + S.cur.no + '?')) labelSent(S.cur, false, '', true); break;
    case 'qstart': startQueue(); break;
    case 'qsend': qSend(); break;
    case 'qfail': qFail(); break;
    case 'qskip': qNext(''); break;
    case 'qstop': S.queue = null; S.filter = 'labels'; renderList(); break;
    case 'paid': if (await confirmBox('ບັນທຶກວ່າອໍເດີ #' + S.cur.no + ' ຈ່າຍແລ້ວ?')) update('paid', true); break;
  }
});
$('#scanClose').onclick = closeScanner;
$('#torchBtn').onclick = async () => {
  if (!cam.track) return;
  cam.torch = !cam.torch;
  try { await cam.track.applyConstraints({ advanced: [{ torch: cam.torch }] }); } catch (e) { cam.torch = false; }
};
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.stream) closeScanner(); });
setTimeout(() => { zx().then(Z => Z.readBarcodes(new ImageData(8, 8), { formats: ['EAN-13'] })).catch(() => {}); }, 1500);
$('#undoBtn').onclick = () => {
  const i = S.hist.pop();
  if (i === undefined) { flash('', 'ບໍ່ມີຫຍັງໃຫ້ຍົກເລີກ'); return; }
  if (S.counts[i] > 0) S.counts[i]--; saveScan(); renderScanItems(); renderOrder();
  flash('warn', '↶ ລົບອອກ 1 ' + label(S.cur.items[i]));
};
$('#manualF').onsubmit = e => { e.preventDefault(); const v = $('#manualIn').value; $('#manualIn').value = ''; handleCode(v); };
$('#photoIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  flash('', 'ກຳລັງອ່ານຮູບ…');
  try { handleCode(await readPhoto(f)); }
  catch (err) { flash('bad', '✗ ບໍ່ພົບບາໂຄດໃນຮູບ'); beep(220, .3); }
};
$('#labelIn').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) uploadLabel(f); };
$('#tabSel').onchange = e => { S.queue = null; S.tab = e.target.value; store.set('tab', S.tab); S.cur = null; S.filter = 'topack'; loadOrders(); };
$('#staffBtn').onclick = () => pickStaff();
boot();
