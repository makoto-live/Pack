<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Pack &amp; Ship</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--pri:#1f6feb;--ok:#16a34a;--okbg:#dcfce7;--warn:#d97706;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Lao","Phetsarath OT",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;-webkit-tap-highlight-color:transparent}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;padding:10px 12px;background:#111827;color:#fff}
.brand{font-weight:700;white-space:nowrap}
.bar select{flex:1;min-width:0;padding:9px;border-radius:8px;border:0;font-size:15px}
.chipbtn{background:#374151;color:#fff;border:0;border-radius:999px;padding:9px 12px;font-size:14px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{padding:12px;max-width:720px;margin:0 auto 40px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:14px;color:var(--ink)}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{display:flex;gap:6px;margin-bottom:10px}
.search input{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ono{font-weight:700;font-size:18px}
.mute{color:var(--mute);font-size:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;padding:3px 8px;border-radius:999px;background:#eef0f3;color:var(--mute)}
.pill.y{background:var(--okbg);color:#166534}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;background:#e5e7eb;color:var(--ink);cursor:pointer;font-family:inherit}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.pri{background:var(--pri);color:#fff}.btn.ok{background:var(--ok);color:#fff}.btn.full{width:100%}
.btn:disabled{opacity:.45}
.link{background:none;border:0;color:var(--pri);font-size:14px;padding:10px 0;text-decoration:underline;font-family:inherit}
.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.section h4{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;overflow-wrap:anywhere;font-weight:600}
.cnt{min-width:58px;text-align:center;font-weight:700;border-radius:8px;padding:7px 4px}
.cnt.none{background:#eef0f3}.cnt.part{background:var(--warnbg);color:#92400e}.cnt.done{background:var(--okbg);color:#166534}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);margin-bottom:8px}
.st.y{background:var(--okbg);border-color:#bbf7d0}
.progress{height:8px;background:#eef0f3;border-radius:99px;overflow:hidden;margin:8px 0}
.progress div{height:100%;background:var(--ok);transition:width .2s}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.hidden{display:none!important}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 8px}
#scanner{background:#000;flex-direction:column;align-items:stretch;justify-content:flex-start;overflow:auto}
.scanTop{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:#fff;gap:8px}
.camwrap{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:4/3;background:#000;overflow:hidden}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;left:5%;right:5%;top:20%;bottom:20%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35);transition:border-color .15s}
.guide::after{content:'';position:absolute;left:4%;right:4%;top:50%;height:2px;background:#ef4444;opacity:.8}
.guide[data-k=ok]{border-color:#22c55e}.guide[data-k=bad]{border-color:#ef4444}.guide[data-k=warn]{border-color:#f59e0b}
.camerr{margin:8px 12px;padding:10px;border-radius:10px;background:var(--warnbg);color:#92400e;font-size:14px}
.msg{margin:8px 12px;padding:12px;border-radius:10px;font-weight:700;text-align:center;background:#1f2937;color:#fff;font-size:17px;overflow-wrap:anywhere}
.msg.ok{background:var(--ok)}.msg.bad{background:var(--bad)}.msg.warn{background:var(--warn)}
.scanPanel{background:#fff;border-radius:16px 16px 0 0;padding:12px;margin-top:auto}
.manual{display:flex;gap:6px;margin:8px 0}
.manual input,input.txt{flex:1;min-width:0;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
input.txt{margin:8px 0 12px}
.camerr{margin:8px 12px;padding:10px;border-radius:10px;background:var(--warnbg);color:#92400e;font-size:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.staffgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.center{text-align:center;padding:40px 10px;color:var(--mute)}
a{color:var(--pri)}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">📦 Pack</div>
  <select id="tabSel" aria-label="Live session"></select>
  <button id="staffBtn" class="chipbtn">👤 …</button>
</header>
<main id="app"><div class="center">Loading…</div></main>

<div id="scanner" class="overlay hidden">
  <div class="scanTop"><b id="scanTitle"></b><div class="row" style="gap:6px"><button class="btn sm hidden" id="torchBtn">🔦 Light</button><button class="btn sm" id="scanClose">Done</button></div></div>
  <div class="camwrap" id="camWrap"><video id="cam" playsinline muted autoplay></video><div class="guide"></div></div>
  <div id="camErr" class="camerr hidden"></div>
  <div id="scanMsg" class="msg">Point the camera at a barcode</div>
  <div class="scanPanel">
    <div class="row" style="gap:6px">
      <button class="btn sm" id="undoBtn" style="flex:1">↶ Undo last</button>
      <label class="btn sm" style="flex:1">📷 From photo<input type="file" accept="image/*" capture="environment" id="photoIn" hidden></label>
    </div>
    <form class="manual" id="manualF"><input id="manualIn" placeholder="Type barcode or code (e.g. L60)" autocomplete="off"><button class="btn sm pri">Add</button></form>
    <div id="scanItems"></div>
  </div>
</div>

<div id="modal" class="overlay hidden"><div class="sheet" id="modalBody"></div></div>
<div id="toast"></div>
<div id="filescan" style="display:none"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem('ps_' + k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem('ps_' + k, v); } catch(e) {} },
  del(k){ try { localStorage.removeItem('ps_' + k); } catch(e) {} }
};
const money = n => (Number(n) || 0).toLocaleString('en-US');
const S = { pin: store.get('pin') || '', staff: store.get('staff') || '', staffList: [], tabs: [], tab: '', names: {},
  orders: [], at: '', filter: 'topack', q: '', cur: null, counts: [], hist: [], last: { c: '', t: 0 }, busy: false };

(function () {
  try { const q = new URLSearchParams(location.search).get('api'); if (q) store.set('api', q); } catch (e) {}
})();
const API = store.get('api') || 'https://script.google.com/macros/s/AKfycbzIsGrHnZiYnKNlQkOIFmOkchK4TN5wkbETV-MyUYp1nVAx_Frz114wmCSUCl2k4hcX/exec';
async function api(fn, arg) {
  if (!API) throw new Error('App link is missing the sheet address. Ask the shop owner for the full staff link.');
  const action = { apiBootstrap: 'bootstrap', apiOrders: 'orders', apiUpdate: 'update' }[fn];
  const payload = fn === 'apiOrders' ? { tab: arg } : (arg || {});
  const url = API + '?action=' + action + '&pin=' + encodeURIComponent(S.pin) + '&payload=' + encodeURIComponent(JSON.stringify(payload));
  let r;
  try { r = await fetch(url, { redirect: 'follow' }); } catch (e) { throw new Error('No connection to the sheet. Check internet and try again.'); }
  let j; try { j = await r.json(); } catch (e) { throw new Error('The sheet did not answer correctly. Check the Apps Script deployment is "Anyone".'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j.data;
}
const errMsg = e => String((e && e.message) || e || 'Error').replace(/^Exception:\s*/, '');

/* ---------- feedback ---------- */
let AC;
function beep(freq, dur) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = freq; o.connect(g); g.connect(AC.destination); g.gain.value = 0.15;
    o.start(); o.stop(AC.currentTime + dur);
  } catch(e) {}
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e) {} };
let toastT;
function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms || 2500); }
function flash(kind, msg) { const m = $('#scanMsg'); m.className = 'msg ' + kind; m.textContent = msg; const g = document.querySelector('.guide'); if (g) g.dataset.k = kind || ''; }

/* ---------- dialogs ---------- */
function dialog(html, mount) {
  return new Promise(res => {
    $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden');
    mount(v => { $('#modal').classList.add('hidden'); res(v); });
  });
}
function ask(title, label, val, type) {
  return dialog(`<h3>${esc(title)}</h3><div class="mute">${esc(label || '')}</div>
    <input class="txt" id="dlgIn" type="${type || 'text'}" value="${esc(val || '')}">
    <div class="row"><button class="btn" id="dlgNo">Cancel</button><button class="btn pri" id="dlgOk">OK</button></div>`, done => {
    const i = $('#dlgIn'); setTimeout(() => i.focus(), 50);
    $('#dlgNo').onclick = () => done(null); $('#dlgOk').onclick = () => done(i.value);
    i.onkeydown = e => { if (e.key === 'Enter') done(i.value); };
  });
}
function confirmBox(msg) {
  return dialog(`<p style="margin-top:0">${esc(msg)}</p><div class="row"><button class="btn" id="dlgNo">Cancel</button><button class="btn pri" id="dlgOk">Yes</button></div>`,
    done => { $('#dlgNo').onclick = () => done(false); $('#dlgOk').onclick = () => done(true); });
}
async function pickStaff() {
  const list = S.staffList;
  const n = await dialog(`<h3>Who is packing?</h3>
    ${list.length ? `<div class="staffgrid">${list.map(x => `<button class="btn" data-n="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="mute" style="margin-top:12px">Or type your name</div>` : '<div class="mute">Type your name — it is saved with every order you pack, ship or mark paid.</div>'}
    <input class="txt" id="dlgIn" value="${esc(S.staff)}" placeholder="Your name"><button class="btn pri full" id="dlgOk">Continue</button>`, done => {
    document.querySelectorAll('[data-n]').forEach(b => b.onclick = () => done(b.dataset.n));
    const ok = () => { const v = $('#dlgIn').value.trim(); if (v) done(v); };
    $('#dlgOk').onclick = ok; $('#dlgIn').onkeydown = e => { if (e.key === 'Enter') ok(); };
  });
  S.staff = n; store.set('staff', n); $('#staffBtn').textContent = '👤 ' + n;
}

/* ---------- boot & data ---------- */
async function boot() {
  try {
    const b = await api('apiBootstrap');
    S.tabs = b.tabs; S.staffList = b.staff; S.names = b.names || {};
    if (!S.tabs.length) { $('#app').innerHTML = '<div class="center">No tabs starting with “live” were found in this sheet.</div>'; return; }
    const saved = store.get('tab');
    S.tab = S.tabs.includes(saved) ? saved : S.tabs[0];
    $('#tabSel').innerHTML = S.tabs.map(t => `<option ${t === S.tab ? 'selected' : ''}>${esc(t)}</option>`).join('');
    if (!S.staff) await pickStaff(); else $('#staffBtn').textContent = '👤 ' + S.staff;
    await loadOrders();
  } catch (e) {
    if (errMsg(e).includes('PIN_REQUIRED')) {
      const p = await ask('Enter PIN', S.pin ? 'That PIN was not accepted.' : 'Ask the shop owner for the PIN.', '', 'password');
      if (p !== null) { S.pin = p.trim(); store.set('pin', S.pin); return boot(); }
    }
    $('#app').innerHTML = `<div class="center">⚠ ${esc(errMsg(e))}<br><br><button class="btn" onclick="boot()">Try again</button></div>`;
  }
}
async function loadOrders(quiet) {
  if (!quiet && !S.cur) $('#app').innerHTML = '<div class="center">Loading orders…</div>';
  try {
    const r = await api('apiOrders', S.tab);
    S.orders = r.orders; S.at = r.at;
    if (S.cur) { const o = S.orders.find(x => x.no === S.cur.no); if (o) { S.cur = o; renderOrder(); } else { S.cur = null; renderList(); } }
    else renderList();
  } catch (e) { toast('⚠ ' + errMsg(e), 5000); if (!S.cur) $('#app').innerHTML = `<div class="center">⚠ ${esc(errMsg(e))}</div>`; }
}

/* ---------- list ---------- */
const FILTERS = [['topack', 'To pack', o => !o.packed], ['toship', 'To ship', o => o.packed && !o.shipped], ['unpaid', 'Unpaid', o => !o.paid], ['all', 'All', () => true]];
function renderList() {
  S.cur = null;
  $('#app').innerHTML = `
    <div class="filters">${FILTERS.map(f => `<button data-f="${f[0]}" class="${S.filter === f[0] ? 'on' : ''}">${f[1]} (${S.orders.filter(f[2]).length})</button>`).join('')}</div>
    <div class="search"><input id="q" placeholder="Search order no, name, phone" value="${esc(S.q)}" inputmode="search"><button class="btn sm" data-act="refresh" title="Refresh">↻</button></div>
    <div id="list"></div><div class="mute" style="text-align:center">Updated ${esc(S.at)}</div>`;
  $('#q').oninput = e => { S.q = e.target.value; renderCards(); };
  renderCards();
}
function renderCards() {
  const f = FILTERS.find(x => x[0] === S.filter)[2], q = S.q.trim().toLowerCase();
  const list = S.orders.filter(o => f(o) && (!q || (o.no + ' ' + o.name + ' ' + o.phone).toLowerCase().includes(q)));
  $('#list').innerHTML = list.length ? list.map(o => {
    const n = o.items.reduce((a, it) => a + it.qty, 0);
    return `<button class="card" data-open="${esc(o.no)}">
      <div class="row"><span class="ono">#${esc(o.no)}</span><span class="mute">${n} item${n === 1 ? '' : 's'} · ${money(o.total)}</span></div>
      <div style="overflow-wrap:anywhere">${esc(o.name) || '<span class="mute">(no name)</span>'}</div>
      <div class="pills"><span class="pill ${o.packed ? 'y' : ''}">${o.packed ? '✓ ' : ''}Packed</span><span class="pill ${o.shipped ? 'y' : ''}">${o.shipped ? '✓ ' : ''}Shipped</span><span class="pill ${o.paid ? 'y' : ''}">${o.paid ? '✓ ' : ''}Paid</span></div>
    </button>`;
  }).join('') : '<div class="center">No orders here.</div>';
}

/* ---------- order ---------- */
const scanKey = o => 'scan|' + S.tab + '|' + o.no;
function openOrder(no) {
  const o = S.orders.find(x => x.no === no); if (!o) return;
  S.cur = o; let c = null;
  try { c = JSON.parse(store.get(scanKey(o)) || 'null'); } catch (e) {}
  S.counts = (c && c.length === o.items.length) ? c : o.items.map(() => 0);
  S.hist = []; renderOrder(); window.scrollTo(0, 0);
}
const saveScan = () => { if (S.cur) store.set(scanKey(S.cur), JSON.stringify(S.counts)); };
const complete = () => S.cur.items.length > 0 && S.cur.items.every((it, i) => S.counts[i] >= it.qty);
const label = it => it.name || it.raw || it.code || it.barcode;

function renderOrder() {
  const o = S.cur; if (!o) return renderList();
  const need = o.items.reduce((a, it) => a + it.qty, 0);
  const got = o.items.reduce((a, it, i) => a + Math.min(S.counts[i], it.qty), 0);
  const done = complete(), B = S.busy ? 'disabled' : '';
  const who = (by, at) => (by || at) ? `<div class="mute">${esc(by)}${by && at ? ' · ' : ''}${esc(at)}</div>` : '';
  const items = o.items.map((it, i) => {
    const c = o.packed ? it.qty : S.counts[i];
    const cls = c >= it.qty ? 'done' : c > 0 ? 'part' : 'none';
    return `<div class="item"><div class="nm"><b>${esc(label(it))}</b><span class="mute">${esc(it.code)}${it.code && it.barcode ? ' · ' : ''}${esc(it.barcode) || '<i>no barcode</i>'}</span></div>
      ${!o.packed && !it.barcode ? `<button class="btn sm" data-tick="${i}" ${B}>${S.counts[i] >= it.qty ? 'Untick' : '✓ Tick'}</button>` : ''}
      ${!o.packed && it.barcode && S.counts[i] > 0 ? `<button class="btn sm" data-minus="${i}">−</button>` : ''}
      <div class="cnt ${cls}">${o.packed ? '✓ ' + it.qty : c + '/' + it.qty}</div></div>`;
  }).join('');

  $('#app').innerHTML = `
    <button class="link" data-act="back">‹ All orders</button>
    <div class="section">
      <div class="row"><span class="ono">#${esc(o.no)}</span><span class="mute">${esc(S.tab)}</span></div>
      <div style="font-size:18px;font-weight:600;overflow-wrap:anywhere">${esc(o.name)}</div>
      ${o.phone ? `<div><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a></div>` : ''}
      ${o.address ? `<div class="mute" style="overflow-wrap:anywhere">${esc(o.address)}</div>` : ''}
      <div class="row" style="margin-top:6px"><span>Total <b>${money(o.total)}</b></span><span class="mute">Transferred ${money(o.transferred)}</span></div>
      ${o.status ? `<div class="mute">${esc(o.status)}</div>` : ''}
      ${o.tracking ? `<div class="mute">Tracking: ${esc(o.tracking)}</div>` : ''}
    </div>
    <div class="section">
      <h4>ITEMS ${o.packed ? '' : `· ${got}/${need} checked`}</h4>
      ${o.packed ? '' : `<div class="progress"><div style="width:${need ? Math.round(got / need * 100) : 0}%"></div></div>`}
      ${items || '<div class="mute">No items on this order.</div>'}
    </div>
    ${o.packed ? '' : `<div class="section">
      ${done ? `<button class="btn ok full" data-act="pack" ${B}>✓ Mark packed</button>`
             : `<button class="btn pri full" data-act="scan" ${B}>📷 Scan items</button>`}
      <div class="row">
        ${done ? '<button class="link" data-act="scan">Scan again</button>' : '<button class="link" data-act="override">Pack without full scan…</button>'}
        ${got ? '<button class="link" data-act="reset">Reset scans</button>' : ''}
      </div>
    </div>`}
    <div class="section"><h4>STATUS</h4>
      <div class="st ${o.packed ? 'y' : ''}"><div><b>${o.packed ? '✓ Packed' : 'Not packed'}</b>${who(o.packedBy, o.packedAt)}</div>
        ${o.packed ? `<button class="btn sm" data-undo="packed" ${B}>Undo</button>` : ''}</div>
      <div class="st ${o.shipped ? 'y' : ''}"><div><b>${o.shipped ? '✓ Shipped' : 'Not shipped'}</b>${who(o.shippedBy, o.shippedAt)}</div>
        ${o.shipped ? `<button class="btn sm" data-undo="shipped" ${B}>Undo</button>` : o.packed ? `<button class="btn sm pri" data-act="ship" ${B}>Mark shipped</button>` : '<span class="mute">pack first</span>'}</div>
      <div class="st ${o.paid ? 'y' : ''}"><div><b>${o.paid ? '✓ Paid' : 'Not paid'}</b>${who(o.paidBy, o.paidAt)}</div>
        ${o.paid ? `<button class="btn sm" data-undo="paid" ${B}>Undo</button>` : `<button class="btn sm pri" data-act="paid" ${B}>Mark paid</button>`}</div>
    </div>`;
}

async function update(action, value, extra) {
  if (S.busy) return;
  S.busy = true; renderOrder();
  try {
    const r = await api('apiUpdate', Object.assign({ tab: S.tab, orderNo: S.cur.no, action, value, staff: S.staff }, extra || {}));
    if (r.order) { const i = S.orders.findIndex(x => x.no === r.order.no); if (i >= 0) S.orders[i] = r.order; S.cur = r.order; }
    if (action === 'packed' && value) store.del(scanKey(S.cur));
    if (action === 'packed' && !value) S.counts = S.cur.items.map(() => 0);
    toast(value ? '✓ Marked ' + action : 'Undone: ' + action); vib(60);
  } catch (e) { toast('⚠ ' + errMsg(e), 6000); }
  finally { S.busy = false; renderOrder(); }
}
async function doPack(override) {
  const o = S.cur; let reason = '';
  if (override) {
    reason = await ask('Pack without full scan', 'Reason (e.g. barcode missing, label damaged). This is saved in the Pack Log.', '');
    if (reason === null) return;
    if (!reason.trim()) { toast('Please give a reason'); return; }
  }
  const details = o.items.map((it, i) => (it.code || it.barcode || '?') + ' ' + S.counts[i] + '/' + it.qty).join(', ') + (override ? ' | OVERRIDE: ' + reason.trim() : ' | scan-verified');
  await update('packed', true, { verified: !override, details });
}

/* ---------- scanning ---------- */
const normKey = t => { const d = t.replace(/\D/g, ''); return (d.length >= 6 && /^[\d\s\-]+$/.test(t)) ? d.replace(/^0+/, '') : t.toUpperCase(); };
const matches = (it, k) => (it.barcode && it.barcode === k) || (it.code && it.code.toUpperCase() === k);
const ZX_FORMATS = ['EAN-13', 'EAN-8', 'UPC-A', 'UPC-E', 'Code128', 'Code39', 'QRCode'];
let zxReady = null;
function zx() {
  if (!zxReady) zxReady = new Promise((res, rej) => {
    if (window.ZXingWASM) return res(window.ZXingWASM);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/zxing-wasm@2.2.4/dist/iife/reader/index.js';
    s.onload = () => window.ZXingWASM ? res(window.ZXingWASM) : rej(new Error('Scanner engine missing'));
    s.onerror = () => { zxReady = null; rej(new Error('Scanner engine could not load. Check internet, then close and reopen the scanner.')); };
    document.head.appendChild(s);
  });
  return zxReady;
}
async function decodeImageData(id, harder) {
  const Z = await zx();
  const r = await Z.readBarcodes(id, { formats: ZX_FORMATS, tryHarder: !!harder, maxNumberOfSymbols: 1 });
  const hit = r.find(x => x.isValid && x.text);
  return hit ? hit.text : '';
}

function handleCode(raw) {
  const o = S.cur; if (!o || o.packed) return;
  const text = String(raw || '').trim(); if (!text) return;
  const key = normKey(text);
  const idx = o.items.map((_, i) => i).filter(i => matches(o.items[i], key));
  if (!idx.length) {
    const nm = S.names[key];
    flash('bad', '✗ NOT in this order' + (nm ? ': ' + nm : '') + ' (' + text + ')');
    beep(220, .45); vib([200, 100, 200]); return;
  }
  const i = idx.find(j => S.counts[j] < o.items[j].qty);
  if (i === undefined) {
    const it = o.items[idx[0]];
    flash('warn', '⚠ Too many — order needs only ' + it.qty + ' × ' + label(it));
    beep(440, .3); vib([100, 60, 100]); return;
  }
  S.counts[i]++; S.hist.push(i); saveScan();
  const it = o.items[i];
  renderScanItems(); renderOrder();
  if (complete()) {
    flash('ok', '✓ All items matched!'); beep(1200, .12); setTimeout(() => beep(1600, .2), 160); vib(200);
    setTimeout(closeScanner, 1200);
  } else {
    flash('ok', '✓ ' + label(it) + '  ' + S.counts[i] + '/' + it.qty); beep(1000, .12); vib(60);
  }
}
function renderScanItems() {
  const o = S.cur; if (!o) return;
  $('#scanTitle').textContent = 'Order #' + o.no;
  $('#scanItems').innerHTML = o.items.map((it, i) => {
    const c = S.counts[i], cls = c >= it.qty ? 'done' : c > 0 ? 'part' : 'none';
    return `<div class="item"><div class="nm"><b>${esc(label(it))}</b><span class="mute">${esc(it.code)} ${esc(it.barcode) || '<i>no barcode — tick on order screen</i>'}</span></div><div class="cnt ${cls}">${c}/${it.qty}</div></div>`;
  }).join('');
}
const cam = { stream: null, track: null, timer: null, busy: false, n: 0, torch: false };
const grab = document.createElement('canvas');
const gctx = grab.getContext('2d', { willReadFrequently: true });
function camErr(m) { const el = $('#camErr'); el.textContent = m; el.classList.remove('hidden'); }
function camMessage(e) {
  const n = (e && e.name) || '';
  if (n === 'NotAllowedError' || n === 'SecurityError') return 'Camera is blocked. iPhone: tap "aA" in the Safari address bar → Website Settings → Camera → Allow, then reload. If you opened this link inside LINE, Messenger or Facebook, open it in Safari or Chrome instead.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return 'No back camera found on this device.';
  if (n === 'NotReadableError') return 'The camera is being used by another app. Close other camera apps and try again.';
  return 'Camera could not start (' + errMsg(e) + ').';
}
async function openScanner() {
  S.last = { c: '', t: 0 };
  $('#scanner').classList.remove('hidden'); $('#camErr').classList.add('hidden');
  flash('', 'Starting camera…'); renderScanItems();
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume && AC.resume(); } catch (e) {}
  zx().catch(e => camErr(errMsg(e)));
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return camErr('This browser cannot use the camera. Open the link in Safari (iPhone) or Chrome (Android).');
  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
  } catch (e) { cam.stream = null; flash('', 'Camera off — use “From photo” or type the code'); return camErr(camMessage(e)); }
  if ($('#scanner').classList.contains('hidden')) { stopCamera(); return; }
  const v = $('#cam'); v.muted = true; v.setAttribute('playsinline', ''); v.srcObject = cam.stream;
  try { await v.play(); } catch (e) {}
  cam.track = cam.stream.getVideoTracks()[0];
  tuneCamera();
  flash('', 'Point at a barcode inside the box — hold 15–30 cm away');
  cam.n = 0; loop();
}
async function tuneCamera() {
  const t = cam.track; let c = {};
  try { c = (t && t.getCapabilities && t.getCapabilities()) || {}; } catch (e) {}
  if (c.focusMode && c.focusMode.indexOf('continuous') >= 0) { try { await t.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {} }
  if (c.zoom && c.zoom.max >= 1.5) { try { await t.applyConstraints({ advanced: [{ zoom: Math.min(1.8, c.zoom.max) }] }); } catch (e) {} }
  cam.torch = false; $('#torchBtn').classList.toggle('hidden', !c.torch);
}
function loop() {
  if (!cam.stream) return;
  cam.timer = setTimeout(async () => {
    const v = $('#cam');
    if (cam.stream && !cam.busy && v.readyState >= 2 && v.videoWidth) {
      cam.busy = true;
      try {
        const vw = v.videoWidth, vh = v.videoHeight, A = 4 / 3;
        let visW = vw, visH = vh;                       // part of the frame visible in the 4:3 box
        if (vw / vh > A) visW = vh * A; else visH = vw / A;
        const full = (cam.n++ % 4 === 3);               // every 4th frame look at the whole view
        const cw = full ? visW : visW * 0.9, ch = full ? visH : visH * 0.6;
        const sx = (vw - cw) / 2, sy = (vh - ch) / 2, sc = Math.min(1, 1280 / cw);
        grab.width = Math.round(cw * sc); grab.height = Math.round(ch * sc);
        gctx.drawImage(v, sx, sy, cw, ch, 0, 0, grab.width, grab.height);
        const text = await decodeImageData(gctx.getImageData(0, 0, grab.width, grab.height), full);
        if (text && cam.stream) {
          const now = Date.now();
          if (!(text === S.last.c && now - S.last.t < 1800)) { S.last = { c: text, t: now }; handleCode(text); }
        }
      } catch (e) {}
      cam.busy = false;
    }
    loop();
  }, 80);
}
function stopCamera() {
  clearTimeout(cam.timer); cam.timer = null;
  if (cam.stream) { cam.stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); }
  cam.stream = null; cam.track = null;
  try { $('#cam').srcObject = null; } catch (e) {}
}
function loadImg(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => res(i);
    i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('Cannot open photo')); };
    i.src = u;
  });
}
function photoVariant(img, max, crop, boost) {
  const W = img.naturalWidth, H = img.naturalHeight, c = crop || [0, 0, 1, 1];
  const sw = W * c[2], sh = H * c[3], s = Math.min(1, max / Math.max(sw, sh));
  const cv = document.createElement('canvas');
  cv.width = Math.round(sw * s); cv.height = Math.round(sh * s);
  const g = cv.getContext('2d', { willReadFrequently: true });
  if (boost) { try { g.filter = 'grayscale(1) contrast(1.6)'; } catch (e) {} }
  g.drawImage(img, W * c[0], H * c[1], sw, sh, 0, 0, cv.width, cv.height);
  return g.getImageData(0, 0, cv.width, cv.height);
}
async function readPhoto(file) {
  const img = await loadImg(file);
  try {
    const plans = [[2000, null, false], [1280, null, false], [1600, [0, 0.25, 1, 0.5], false], [1280, null, true], [2600, null, false]];
    for (const [max, crop, boost] of plans) {
      const t = await decodeImageData(photoVariant(img, max, crop, boost), true);
      if (t) return t;
    }
  } finally { try { URL.revokeObjectURL(img.src); } catch (_) {} }
  throw new Error('No barcode found');
}
async function closeScanner() {
  stopCamera();
  $('#scanner').classList.add('hidden'); renderOrder();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-f],[data-open],[data-act],[data-undo],[data-tick],[data-minus]'); if (!t) return;
  const d = t.dataset;
  if (d.f) { S.filter = d.f; renderList(); return; }
  if (d.open) { openOrder(d.open); return; }
  if (d.tick !== undefined) { const i = +d.tick, it = S.cur.items[i]; S.counts[i] = S.counts[i] >= it.qty ? 0 : it.qty; saveScan(); renderOrder(); return; }
  if (d.minus !== undefined) { const i = +d.minus; if (S.counts[i] > 0) S.counts[i]--; saveScan(); renderOrder(); return; }
  if (d.undo) { if (await confirmBox('Undo “' + d.undo + '” for order #' + S.cur.no + '?')) update(d.undo, false); return; }
  switch (d.act) {
    case 'back': S.cur = null; renderList(); loadOrders(true); break;
    case 'refresh': loadOrders(); break;
    case 'scan': openScanner(); break;
    case 'pack': doPack(false); break;
    case 'override': doPack(true); break;
    case 'reset': if (await confirmBox('Clear the scanned counts for this order?')) { S.counts = S.cur.items.map(() => 0); saveScan(); renderOrder(); } break;
    case 'ship': { const tr = await ask('Mark shipped', 'Tracking number (optional)', S.cur.tracking || ''); if (tr !== null) update('shipped', true, { tracking: tr.trim() }); break; }
    case 'paid': if (await confirmBox('Mark order #' + S.cur.no + ' as paid?')) update('paid', true); break;
  }
});
$('#scanClose').onclick = closeScanner;
$('#torchBtn').onclick = async () => {
  if (!cam.track) return;
  cam.torch = !cam.torch;
  try { await cam.track.applyConstraints({ advanced: [{ torch: cam.torch }] }); } catch (e) { cam.torch = false; }
};
document.addEventListener('visibilitychange', () => { if (document.hidden && cam.stream) closeScanner(); });
setTimeout(() => { zx().then(Z => Z.readBarcodes(new ImageData(8, 8), { formats: ['EAN-13'] })).catch(() => {}); }, 1500);
$('#undoBtn').onclick = () => {
  const i = S.hist.pop();
  if (i === undefined) { flash('', 'Nothing to undo'); return; }
  if (S.counts[i] > 0) S.counts[i]--; saveScan(); renderScanItems(); renderOrder();
  flash('warn', '↶ Removed one ' + label(S.cur.items[i]));
};
$('#manualF').onsubmit = e => { e.preventDefault(); const v = $('#manualIn').value; $('#manualIn').value = ''; handleCode(v); };
$('#photoIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  flash('', 'Reading photo…');
  try { handleCode(await readPhoto(f)); }
  catch (err) { flash('bad', '✗ No barcode found in photo'); beep(220, .3); }
};
$('#tabSel').onchange = e => { S.tab = e.target.value; store.set('tab', S.tab); S.cur = null; S.filter = 'topack'; loadOrders(); };
$('#staffBtn').onclick = () => pickStaff();
boot();
</script>
</body>
</html>
